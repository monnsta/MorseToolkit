[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "morse"
version = "0.1.0"
description = "A flexible Morse code toolkit for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
	{ name = "monnsta" },
]
dependencies = []


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I"]
