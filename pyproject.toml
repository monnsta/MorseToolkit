[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "morse"
dynamic = ["version"]
description = "A flexible Morse code toolkit for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
	{ name = "monnsta" },
]
dependencies = []

[project.optional-dependencies]
cli = [
	"typer>=0.16",
	"rich>=13.9",
	"prompt-toolkit>=3.0.50",
	"platformdirs>=4.3",
	"wordfreq>=3.1",
]

[project.scripts]
morse = "morse.cli:main"

[tool.setuptools.dynamic]
version = { attr = "morse.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I"]
